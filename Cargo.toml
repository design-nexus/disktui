[package]
name = "disktui"
version = "0.1.0"
edition = "2021"
description = "Terminal disk manager for Linux, with Omarchy themes and fstab network shares"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
notify = "8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
